<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191919"><meta name="apple-mobile-web-app-capable" content="yes"><title>Blues Limousine · Cancionero</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--paper:#f5f3ec;--ink:#191919;--line:#c9c5bb;--muted:#686660;--accent:#9a623b;--solo:#285e56;--display:'Bodoni Moda',Didot,Georgia,serif;--sans:'Space Grotesk',Arial,sans-serif;--mono:'IBM Plex Mono',monospace}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}body{font-family:var(--sans);overscroll-behavior:none}button,a,select{touch-action:manipulation}button,a{ -webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}#app{height:100dvh;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding: max(10px,env(safe-area-inset-top)) 22px max(10px,env(safe-area-inset-bottom));overflow:hidden;position:relative;isolation:isolate}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;border-bottom:1px solid var(--line);font:11px var(--mono);letter-spacing:.06em}.top a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none}.brand{text-transform:uppercase}.hero{position:relative;padding:13px 0 12px;isolation:isolate}.hero h1{font:400 clamp(37px,10.9vw,49px)/.93 var(--display);letter-spacing:-.055em;margin:5px 0 6px}.hero h1 em{font-weight:400}.meta{font:10px var(--mono);color:var(--muted);letter-spacing:.07em;text-transform:uppercase}.big{position:absolute;z-index:-1;right:-6px;top:0;font:400 104px/.85 var(--display);letter-spacing:-.09em;color:#dedbd2}.set{flex:1;min-height:0;display:grid;grid-template-rows:repeat(8,minmax(0,1fr));border-top:1px solid var(--line)}.song-link{display:grid;grid-template-columns:36px 1fr 20px;align-items:center;gap:8px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:0}.song-link .num{font:12px var(--mono);color:var(--accent)}.song-link .name{font:600 clamp(19px,5.5vw,25px)/1.02 var(--sans);letter-spacing:-.045em}.arrow{text-align:right;font-size:20px;color:var(--muted)}.structure{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--count),minmax(0,1fr));border-top:1px solid var(--line)}.step{min-height:0;display:flex;flex-direction:column;justify-content:center;padding:3px 8px 3px 0;border-bottom:1px solid var(--line);position:relative}.step strong{font:600 clamp(20px,6.5vw,29px)/1.05 var(--sans);letter-spacing:-.04em}.step small{font:12px/1.13 var(--mono);margin-top:2px;color:var(--muted)}.step.solo{border-left:3px solid var(--solo);padding-left:10px;background:#e5ebe4;color:#204c45}.step.mine{background:var(--ink);color:var(--paper);padding-left:12px}.step.mine small{color:#f0d0a9}.step .provisional{color:#8b552c;font-size:10px}.note{font:10px/1.35 var(--mono);padding:6px 0;color:var(--muted)}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding-top:7px}.bottom a{border:1px solid var(--line);min-height:44px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);font:11px var(--mono)}.bottom a[aria-disabled=true]{visibility:hidden}.bottom .home{background:var(--ink);color:var(--paper);border-color:var(--ink)}.menufoot{display:flex;justify-content:space-between;align-items:center;padding-top:9px;font:10px var(--mono);color:var(--muted)}.edit{display:flex;align-items:center;gap:7px;padding:5px 0;font:10px var(--mono);color:var(--muted)}.edit select{min-width:0;flex:1;background:transparent;color:var(--ink);border:1px solid var(--line);font:12px var(--sans);padding:6px 2px;border-radius:0;min-height:32px}.song-link:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}@media(max-height:690px){.hero{padding:7px 0}.hero h1{font-size:34px}.big{font-size:76px}.step strong{font-size:20px}.step small{font-size:10px}.top{min-height:40px}.bottom a{min-height:40px}.note{padding:3px 0}}@media(max-height:490px){#app{height:auto;min-height:100dvh;overflow:visible}.step,.song-link{min-height:42px}}
</style></head><body><main id="app"></main><script>
const songs=[{"title":"Honest I Do","rows":[["Intro (A)"],["A"],["B"],["Solo armónica","A","solo"],["Solo guitarra","A","solo"],["B"],["Outro (A)"]]},{"title":"Hitch Hike","rows":[["Intro"],["A₁ × 2"],["A₂"],["Solo guitarra","B","solo"],["A₁"],["A₂ × 3"]]},{"title":"I Want to Be Loved","key":"G","rows":[["Intro"],["A"],["A"],["C"],["Solo piano","B × 2","solo"],["Solo guitarra","B × 2","solo"],["Solo armónica","B × 2","solo"],["C"],["A"]]},{"title":"Love in Vain","rows":[["Intro"],["A"],["A"],["Solo armónica","","solo"],["Solo guitarra — Juan","","mine"],["A"],["Solo guitarra — Mati","","solo"],["Final"]]},{"title":"Beast of Burden","rows":[["Intro"],["A × 2"],["B"],["A"],["B"],["C — Voz + guitarra","Improvisación de Juan sobre la voz","mine"],["A"],["Outro"]]},{"title":"Time Is on My Side","rows":[["Intro"],["A × 2"],["Solo guitarra y armónica","A","solo"],["B — Recitado","Voz + respuesta de guitarra"],["A"],["A final","A recortada"]]},{"title":"Walking the Dog","rows":[["Nupcial"],["Intro"],["A × 2"],["Solo","A × 2","solo"],["A"],["Solo","A × 1","solo"],["A final × 3"],["Nupcial"]]},{"title":"Black Limousine","rows":[["Intro"],["A × 2"],["Solo armónica","B","solo"],["A"],["Solo Juan y Mati","B × 4 aprox. · Hasta terminar","mine"]],"note":"A: con vuelta Moody · B: 12 compases sin vuelta Moody"}];
const app=document.querySelector('#app');let reggae=6;try{const v=localStorage.getItem('blues-reggae');if(v!==null&&Number.isInteger(+v)&&+v>=-1&&+v<8)reggae=+v}catch(e){}
const pad=n=>String(n).padStart(2,'0');
function render(){const i=Number(location.hash.slice(1))-1;if(!Number.isInteger(i)||i<0||i>=songs.length){app.innerHTML='<header class="top"><span class="brand">Blues Limousine</span><span>27.11.26</span></header><section class="hero"><div class="big" aria-hidden="true">08</div><div class="meta">Setlist / En vivo</div><h1>Blues<br><em>Limousine.</em></h1><div class="meta">Cancionero · 8 temas</div></section><nav class="set" aria-label="Canciones">'+songs.map((s,j)=>'<a class="song-link" href="#'+(j+1)+'"><span class="num">'+pad(j+1)+'</span><span class="name">'+s.title+'</span><span class="arrow">↗</span></a>').join('')+'</nav><footer class="menufoot"><span>ESTRUCTURAS DEL SHOW</span><span>01—08</span></footer>';return}
const s=songs[i],walking=i===6;app.innerHTML='<header class="top"><a href="#" aria-label="Volver al cancionero">← CANCIONERO</a><span>'+pad(i+1)+' / 08</span></header><section class="hero"><div class="big" aria-hidden="true">'+pad(i+1)+'</div><div class="meta">Blues Limousine'+(s.key?' · '+s.key:'')+'</div><h1>'+s.title+'</h1></section><section class="structure" aria-label="Estructura" style="--count:'+s.rows.length+'">'+s.rows.map((r,j)=>'<div class="step '+(r[2]||'')+'"><strong>'+r[0]+'</strong>'+(r[1]?'<small>'+r[1]+'</small>':'')+(walking&&reggae===j?'<small class="provisional">REGGAE · PROVISORIO</small>':'')+'</div>').join('')+'</section>'+(s.note?'<div class="note">'+s.note+'</div>':'')+(walking?'<label class="edit">Ubicar reggae <select id="reggae"><option value="-1">Sin confirmar</option>'+s.rows.map((r,j)=>'<option value="'+j+'">'+(j+1)+'. '+r[0]+'</option>').join('')+'</select></label>':'')+'<nav class="bottom" aria-label="Navegación"><a href="#'+i+'" '+(i===0?'aria-disabled="true" tabindex="-1"':'')+'>← Anterior</a><a class="home" href="#">Menú</a><a href="#'+(i+2)+'" '+(i===7?'aria-disabled="true" tabindex="-1"':'')+'>Siguiente →</a></nav>';
if(walking){const sel=document.querySelector('#reggae');sel.value=String(reggae);sel.onchange=()=>{reggae=+sel.value;try{localStorage.setItem('blues-reggae',String(reggae))}catch(e){}render()}}}
window.addEventListener('hashchange',render);render();
</script></body></html>
