const clone=x=>JSON.parse(JSON.stringify(x)),app=document.querySelector("#app"),pad=n=>String(n).padStart(2,"0"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STORE="blues-setlist-v6";let model=clone(BASE),draft=null,scope="home",edId=null,edTab="structure",returnHash="",lyricSize=21,serial=0;
function uid(){return "new-"+Date.now().toString(36)+"-"+(++serial).toString(36)}
function stored(k){try{return localStorage.getItem(k)}catch(e){return null}}
function migrate(){model.songs.forEach((s,i)=>{const l=stored("blues-lyrics-"+i);if(l!==null&&l!==BASE.songs[i].blocks.map(b=>b.text).join("\n\n")){s.blocks=l.trim()?l.trim().split(/\n\s*\n/).map(text=>({text,part:"—",guess:false})):[]}s.blocks.forEach((b,j)=>{const p=stored("blues-part-v1-"+i+"-"+j);if(p!==null){b.part=p;b.guess=false}})});const re=stored("blues-reggae");if(re!==null&&/^-?\d+$/.test(re)){model.songs[6].rows.forEach((x,j)=>x.reggae=j===Number(re))}}
try{const v=stored(STORE);if(v){const parsed=JSON.parse(v);if(valid(parsed))model=parsed;else migrate()}else migrate();const f=+stored("blues-lyric-size");if(f>=15&&f<=35)lyricSize=f}catch(e){migrate()}
function valid(m){return m&&typeof m.date==="string"&&Array.isArray(m.songs)&&new Set(m.songs.map(s=>s.id)).size===m.songs.length&&m.songs.every(s=>typeof s.id==="string"&&typeof s.title==="string"&&typeof s.key==="string"&&Array.isArray(s.rows)&&Array.isArray(s.blocks)&&s.rows.every(r=>typeof r.title==="string"&&typeof r.detail==="string")&&s.blocks.every(b=>typeof b.text==="string"&&typeof b.part==="string"))}
function persist(m){try{localStorage.setItem(STORE,JSON.stringify(m));return true}catch(e){return false}}
const colors=[["cream","Crema · parte"],["mine","Naranja · guitarra"],["solo","Azul · solo"],["boundary","Gris · inicio/final"],["red","Terracota"],["recital","Crema + detalle azul"]];
function colorClass(c){return colors.some(x=>x[0]===c)?c:"cream"}
function locate(){const [h,mode]=location.hash.slice(1).split("/");let i=model.songs.findIndex(s=>s.id===h);if(i<0&&/^\d+$/.test(h))i=Number(h)-1;return {i:i>=0&&i<model.songs.length?i:-1,lyrics:mode==="letra"}}
const link=(s,lyrics=false)=>"#"+s.id+(lyrics?"/letra":"");

function step(r){return '<div class="step '+colorClass(r.color)+'"><strong>'+esc(r.title)+'</strong>'+(r.detail?'<small>'+esc(r.detail)+'</small>':'')+(r.reggae?'<small class="provisional">REGGAE · PROVISORIO</small>':'')+'</div>'}

function render(){if(draft){renderEditor();return}const {i,lyrics}=locate(),n=model.songs.length;if(i<0){app.innerHTML=top('<span>BLUES LIMOUSINE</span>','<span>SETLIST · '+pad(n)+'</span>')+'<section class="homehero"><h1 style="margin:0"><img class="band-logo" src="logo-original.jpg" alt="Blues Limousine"></h1><div class="subtitle">Setlist · '+esc(displayDate(model.date))+'</div></section><nav class="set" style="--song-count:'+Math.max(1,n)+'" aria-label="Canciones">'+model.songs.map((s,j)=>'<a class="song-link" href="'+link(s)+'"><span class="num">'+pad(j+1)+'</span><span class="name">'+esc(s.title)+'</span><span class="key" aria-label="Tonalidad '+esc(s.key)+'">'+esc(s.key||"—")+'</span><span class="chev" aria-hidden="true"></span></a>').join("")+'</nav><footer class="menufoot"><span>MODO ESCENARIO · V6.1</span><button class="lockbtn" id="edit-set">Editar cancionero</button></footer>';document.querySelector("#edit-set").onclick=()=>begin("home");return}

for(const [id,d] of [["smaller",-2],["larger",2]]){const el=document.getElementById(id);if(el)el.onclick=()=>{lyricSize=Math.max(15,Math.min(35,lyricSize+d));document.querySelector("#lyric-text").style.fontSize=lyricSize+"px";try{localStorage.setItem("blues-lyric-size",String(lyricSize))}catch(e){}}}
}

app.innerHTML=top('<span>MODO EDICIÓN</span>','<span>CAMBIOS SIN GUARDAR</span>')+'<div class="editor-head"><div><div class="editor-mode">BLUES LIMOUSINE</div><h1>'+(home?"Editar cancionero":"Editar canción")+'</h1></div>'+(!home?btn("Repertorio","back-set"):"")+'</div><div class="editor-scroll">'+content+'</div><footer class="editor-footer"><button class="eb" data-action="cancel">Cancelar</button><button class="eb primary" data-action="save">Guardar y salir</button></footer>';
}
app.addEventListener("input",e=>{if(!draft)return;const el=e.target,f=el.dataset.field;if(!f)return;const j=Number(el.closest("[data-j]")?.dataset.j),s=editSong(),v=el.type==="checkbox"?el.checked:el.value;if(f==="date")draft.date=v;else if(scope==="home"&&draft.songs[j])draft.songs[j][f]=v;else if(s){if(f.startsWith("song-"))s[f.slice(5)]=v;else if(f.startsWith("row-")&&s.rows[j])s.rows[j][f.slice(4)]=v;else if(f.startsWith("block-")&&s.blocks[j]){s.blocks[j][f.slice(6)]=v;if(f==="block-part")s.blocks[j].guess=false}}});
app.addEventListener("click",e=>{const target=e.target.closest("[data-action]");if(!draft||!target)return;const a=target.dataset.action,j=Number(target.closest("[data-j]")?.dataset.j),s=editSong(),arr=scope==="home"?draft.songs:edTab==="structure"?s?.rows:s?.blocks;
if(a==="save"){if(draft.songs.some(x=>!x.title.trim()||x.rows.some(r=>!r.title.trim()))){alert("Completá los títulos de las canciones y las partes antes de guardar.");return}if(!persist(draft)){alert("No se pudo guardar en este navegador. Exportá una copia antes de salir.");return}model=draft;draft=null;const exists=model.songs.some(x=>x.id===edId);if(returnHash&& !exists&&scope==="song")location.hash="";else if(scope==="song"&&exists)location.hash=link(model.songs.find(x=>x.id===edId),edTab==="lyrics");render();return}
if(a==="cancel"){if(JSON.stringify(draft)!==JSON.stringify(model)&&!confirm("¿Descartar los cambios sin guardar?"))return;draft=null;render();return}
if(a==="tab-structure"||a==="tab-lyrics"){edTab=a==="tab-structure"?"structure":"lyrics";renderEditor();return}
if(a==="back-set"){scope="home";edId=null;renderEditor();return}
if(a==="open"){scope="song";edId=draft.songs[j].id;edTab="structure";renderEditor();return}
if(a==="up")reorder(arr,j,-1);else if(a==="down")reorder(arr,j,1);else if(a==="duplicate"){const item=clone(arr[j]);if(scope==="home"){item.id=uid();item.title+=" (copia)"}arr.splice(j+1,0,item)}else if(a==="remove"){if(confirm(scope==="home"?"¿Quitar esta canción del borrador?":"¿Quitar este bloque del borrador?"))arr.splice(j,1);else return}else if(a==="add-song"){const x={id:uid(),title:"Nueva canción",key:"",note:"",rows:[],blocks:[]};draft.songs.push(x);scope="song";edId=x.id;edTab="structure";renderEditor();return}else if(a==="add-row"){s.rows.push({title:"D",detail:"",color:"cream",reggae:false})}else if(a==="add-block"){s.blocks.push({part:"—",text:"",guess:false})}else if(a==="restore-all"){if(confirm("¿Restaurar las ocho canciones y la fecha originales en el borrador?"))draft=clone(BASE);else return}else if(a==="restore-rows"||a==="restore-blocks"){const base=BASE.songs.find(x=>x.id===s.id);if(base&&confirm("¿Restaurar esta sección en el borrador?")){if(a==="restore-rows"){s.rows=clone(base.rows);s.note=base.note}else s.blocks=clone(base.blocks)}else return}else if(a==="export"){const blob=new Blob([JSON.stringify(draft,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),anchor=document.createElement("a");anchor.href=url;anchor.download="blues-limousine-setlist.json";anchor.click();setTimeout(()=>URL.revokeObjectURL(url),3000);return}else if(a==="import"){const f=document.createElement("input");f.type="file";f.accept=".json,application/json";f.onchange=async()=>{try{const x=JSON.parse(await f.files[0].text());if(!valid(x))throw Error();if(confirm("¿Reemplazar el borrador con esta copia?")){draft=x;renderEditor()}}catch(e){alert("Archivo de cancionero no válido.")}};f.click();return}
scrollRender();
});
window.addEventListener("hashchange",()=>{if(draft){if(JSON.stringify(draft)!==JSON.stringify(model)&&!confirm("¿Salir del editor sin guardar?")){history.replaceState(null,"",returnHash||location.pathname+location.search);return}draft=null}render()});
window.addEventListener("beforeunload",e=>{if(draft&&JSON.stringify(draft)!==JSON.stringify(model)){e.preventDefault();e.returnValue=""}});
render();
</script></body></html>
