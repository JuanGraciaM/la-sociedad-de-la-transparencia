<style>

:root{--paper:#f5f3ec;--ink:#191919;--line:#cbc7bd;--muted:#686660;--accent:#8d4c2d;--display:'Bodoni Moda',Didot,Georgia,serif;--sans:'Space Grotesk',Arial,sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}body{font-family:var(--sans);overscroll-behavior:none}button,a,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}#app{height:100dvh;max-width:440px;margin:auto;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 19px max(8px,env(safe-area-inset-bottom));overflow:hidden;isolation:isolate}.top{display:flex;align-items:center;justify-content:space-between;min-height:42px;border-bottom:1px solid var(--line);font:10px var(--mono);letter-spacing:.065em;flex-shrink:0}.top a{display:flex;align-items:center;gap:9px;min-height:42px}.brand{text-transform:uppercase}.hero{position:relative;padding:10px 0 9px;isolation:isolate;flex-shrink:0}.hero h1{font:400 clamp(33px,9vw,42px)/.96 var(--display);letter-spacing:-.055em;margin:4px 0 3px}.homehero h1{font-size:clamp(46px,13vw,58px);line-height:.88;margin:8px 0 11px}.meta{font:10px var(--mono);color:var(--muted);letter-spacing:.07em;text-transform:uppercase}.big{position:absolute;right:-5px;top:4px;font:400 103px/.85 var(--display);letter-spacing:-.1em;color:#dedbd2;z-index:-1}.set{flex:1;min-height:0;display:grid;grid-template-rows:repeat(8,minmax(0,1fr));border-top:1px solid var(--line)}.song-link{display:grid;grid-template-columns:37px 1fr 19px;align-items:center;gap:8px;border-bottom:1px solid var(--line);min-height:0}.num{font:12px var(--mono);color:var(--accent)}.name{font:600 clamp(20px,5.5vw,25px)/1.02 var(--sans);letter-spacing:-.045em}.chevron{display:inline-block;width:10px;height:10px;border-top:1.6px solid currentColor;border-right:1.6px solid currentColor;transform:rotate(45deg);margin-right:4px;justify-self:center}.chevron.left{transform:rotate(225deg);margin-left:4px;margin-right:0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:2px 0 9px;flex-shrink:0}.tabs a{font:600 13px var(--sans);display:grid;place-items:center;min-height:37px;background:var(--paper)}.tabs a[aria-current=true]{background:var(--ink);color:var(--paper)}.structure{display:grid;grid-template-rows:repeat(var(--count),minmax(0,1fr));gap:4px;flex:1;min-height:0}.step{display:grid;grid-template-columns:17px 48px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:0;border:1px solid #d8d4cb;background:#ebe8df;padding:3px 8px 3px 5px;position:relative}.step .seq{font:10px var(--mono);color:#78746c;align-self:center}.step .token{font:600 24px/.95 var(--sans);letter-spacing:-.065em;text-align:center;min-width:0}.step .words{min-width:0;display:flex;flex-direction:column;gap:2px}.step strong{font:600 clamp(15px,4.7vw,20px)/1.03 var(--sans);letter-spacing:-.035em;overflow-wrap:anywhere}.step small{font:10px/1.1 var(--mono);color:var(--muted)}.step .rep{font:600 19px/1 var(--sans);white-space:nowrap}.step.part-a{background:#e6e3da}.step.part-b{background:#dfebe5;border-color:#c3d2ca;color:#28564d}.step.part-c{background:#eee1d5;border-color:#dac4b3;color:#754a30}.step.boundary{background:transparent;border-style:dashed;color:#66635c}.step.solo{background:#dce9e5;border-color:#b3cbc0;color:#24554b}.step.mine{background:var(--ink);border-color:var(--ink);color:var(--paper)}.step.mine small,.step.mine .seq{color:#e1c6a7}.step .provisional{color:#8b552c;font-weight:500}.note{font:10px/1.25 var(--mono);padding:5px 0;color:var(--muted)}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding-top:7px;flex-shrink:0}.bottom a{border:1px solid var(--line);min-height:42px;display:flex;gap:7px;align-items:center;justify-content:center;font:10px var(--mono)}.bottom a[aria-disabled=true]{visibility:hidden}.bottom .home{background:var(--ink);color:var(--paper);border-color:var(--ink)}.menufoot{display:flex;justify-content:space-between;padding-top:8px;font:10px var(--mono);color:var(--muted)}.edit{display:flex;align-items:center;gap:7px;padding:5px 0 0;font:10px var(--mono);color:var(--muted);flex-shrink:0}.edit select{flex:1;min-width:0;background:transparent;border:1px solid var(--line);font:12px var(--sans);padding:5px;border-radius:0;min-height:31px}.lyric-panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px}.lyric-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.lyric-tools button,.lyric-tools a,.empty button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;background:transparent;border:1px solid var(--line);padding:6px 12px;font:12px var(--mono)}.lyric-tools .primary,.empty button{background:var(--ink);color:var(--paper);border-color:var(--ink)}.lyric-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 0 18px;font:21px/1.6 Georgia,serif}.empty{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.empty h2{font:400 37px/.98 var(--display);letter-spacing:-.04em;margin:0}.empty p{font:15px/1.5 var(--sans);margin:0;color:var(--muted);max-width:30ch}.lyric-panel textarea{width:100%;flex:1;min-height:0;resize:none;padding:12px;font:16px/1.5 var(--sans);border:1px solid var(--line);border-radius:0;background:#fffdf7}.hint{font:10px/1.4 var(--mono);color:var(--muted)}:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media(max-height:700px){.hero{padding:6px 0}.hero h1{font-size:32px}.homehero h1{font-size:43px}.top,.top a{min-height:34px}.tabs{margin-bottom:5px}.tabs a{min-height:32px}.structure{gap:3px}.step{grid-template-columns:14px 41px minmax(0,1fr) auto;gap:5px;padding:2px 5px}.step strong{font-size:15px}.step small{font-size:9px}.step .token{font-size:21px}.step .rep{font-size:17px}.bottom a{min-height:37px}}

</style></head><body><main id="app"></main><script>
const songs=[{"title":"Honest I Do","rows":[["Intro (A)"],["A"],["B"],["Solo armónica","A","solo"],["Solo guitarra","A","solo"],["B"],["Outro (A)"]]},{"title":"Hitch Hike","rows":[["Intro"],["A₁ × 2"],["A₂"],["Solo guitarra","B","solo"],["A₁"],["A₂ × 3"]]},{"title":"I Want to Be Loved","key":"G","rows":[["Intro"],["A"],["A"],["C"],["Solo piano","B × 2","solo"],["Solo guitarra","B × 2","solo"],["Solo armónica","B × 2","solo"],["C"],["A"]]},{"title":"Love in Vain","rows":[["Intro"],["A"],["A"],["Solo armónica","","solo"],["Solo guitarra — Juan","","mine"],["A"],["Solo guitarra — Mati","","solo"],["Final"]]},{"title":"Beast of Burden","rows":[["Intro"],["A × 2"],["B"],["A"],["B"],["C — Voz + guitarra","Improvisación de Juan sobre la voz","mine"],["A"],["Outro"]]},{"title":"Time Is on My Side","rows":[["Intro"],["A × 2"],["Solo guitarra y armónica","A","solo"],["B — Recitado","Voz + respuesta de guitarra"],["A"],["A final","A recortada"]]},{"title":"Walking the Dog","rows":[["Nupcial"],["Intro"],["A × 2"],["Solo","A × 2","solo"],["A"],["Solo","A × 1","solo"],["A final × 3"],["Nupcial"]]},{"title":"Black Limousine","rows":[["Intro"],["A × 2"],["Solo armónica","B","solo"],["A"],["Solo Juan y Mati","B × 4 aprox. · Hasta terminar","mine"]],"note":"A: con vuelta Moody · B: 12 compases sin vuelta Moody"}];
const app=document.querySelector('#app');const pad=n=>String(n).padStart(2,'0');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let reggae=6;try{const v=localStorage.getItem('blues-reggae');if(v!==null&&Number.isInteger(+v)&&+v>=-1&&+v<8)reggae=+v}catch(e){}let editing=false,lyricSize=21;const sessionLyrics={};
function getLyric(i){if(i in sessionLyrics)return sessionLyrics[i];try{return localStorage.getItem('blues-lyrics-'+i)||''}catch(e){return ''}}
function saveLyric(i,v){sessionLyrics[i]=v;try{localStorage.setItem('blues-lyrics-'+i,v);return true}catch(e){return false}}
function step(r,j,walking){let [label,sub='',kind='']=r;let token='',name=label,detail=sub,rep='',type=kind;const match=label.match(/^([ABC][₁₂]?)(?: × (\d+))?$/);if(match){token=match[1];name='Parte '+match[1];rep=match[2]?'×'+match[2]:'';type='part-'+match[1][0].toLowerCase()}else if(kind==='solo'||kind==='mine'){const base=sub.match(/^([ABC])(?: × (\d+))?(?:\s*(aprox\.))?(.*)$/);token=base?base[1]:(label.startsWith('C —')?'C':'S');if(base){rep=base[2]?'×'+base[2]+(base[3]?'~':''):'';detail=base[4].replace(/^\s*·\s*/,'').trim();if(!rep&&detail==='')detail='Sobre '+base[1]}if(label.startsWith('C —'))name='Voz + guitarra'}else if(/^B —/.test(label)){token='B';name=label.replace(/^B — /,'');type='part-b'}else if(/^A final/.test(label)){token='A';name='Final';rep=label.includes('×')?'×'+label.split('×')[1].trim():'';type='part-a'}else{token=/^Intro/.test(label)?'IN':/^Outro|^Final/.test(label)?'FIN':'N';type='boundary'}
return '<div class="step '+type+'"><span class="seq">'+pad(j+1)+'</span><span class="token">'+esc(token)+'</span><div class="words"><strong>'+esc(name)+'</strong>'+(detail?'<small>'+esc(detail)+'</small>':'')+(walking&&reggae===j?'<small class="provisional">REGGAE · PROVISORIO</small>':'')+'</div><span class="rep">'+esc(rep)+'</span></div>'}
function render(){const [hash,mode]=location.hash.slice(1).split('/');const i=Number(hash)-1;const lyrics=mode==='letra';if(!Number.isInteger(i)||i<0||i>=songs.length){app.innerHTML='<header class="top"><span class="brand">Blues Limousine</span><span>27.11.26</span></header><section class="hero homehero"><div class="big" aria-hidden="true">08</div><div class="meta">Setlist / En vivo</div><h1>Blues<br><em>Limousine.</em></h1><div class="meta">Cancionero · 8 temas</div></section><nav class="set" aria-label="Canciones">'+songs.map((s,j)=>'<a class="song-link" href="#'+(j+1)+'"><span class="num">'+pad(j+1)+'</span><span class="name">'+esc(s.title)+'</span><span class="chevron" aria-hidden="true"></span></a>').join('')+'</nav><footer class="menufoot"><span>REPERTORIO DEL SHOW</span><span>01—08</span></footer>';return}
const s=songs[i],walking=i===6;const href=n=>'#'+n+(lyrics?'/letra':'');const l=getLyric(i);
let middle=lyrics?'<section class="lyric-panel">'+(editing?'<div class="lyric-tools"><button id="save" class="primary">Guardar letra</button><button id="cancel">Cancelar</button></div><textarea id="lyric-input" placeholder="Pegá la letra completa acá" aria-label="Letra de la canción">'+esc(l)+'</textarea><div class="hint">Se guarda en este navegador.</div>':'<div class="lyric-tools"><button id="edit-lyric" class="primary">'+(l?'Editar letra':'Agregar letra')+'</button><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q='+encodeURIComponent('The Rolling Stones '+s.title+' lyrics')+'">Buscar letra</a>'+(l?'<button id="smaller" aria-label="Reducir letra">A−</button><button id="larger" aria-label="Aumentar letra">A+</button>':'')+'</div>'+(l?'<article class="lyric-scroll" id="lyric-text" style="font-size:'+lyricSize+'px">'+esc(l)+'</article>':'<div class="empty"><span class="meta">Letra / '+pad(i+1)+'</span><h2>La canción,<br>en palabras.</h2><p>Buscá o pegá tu versión de la letra para tenerla a mano durante el ensayo.</p></div>'))+'</section>':'<section class="structure" aria-label="Estructura" style="--count:'+s.rows.length+'">'+s.rows.map((r,j)=>step(r,j,walking)).join('')+'</section>'+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+(walking?'<label class="edit">Ubicar reggae <select id="reggae"><option value="-1">Sin confirmar</option>'+s.rows.map((r,j)=>'<option value="'+j+'">'+(j+1)+'. '+esc(r[0])+'</option>').join('')+'</select></label>':'');
app.innerHTML='<header class="top"><a href="#" aria-label="Volver al cancionero"><span class="chevron left" aria-hidden="true"></span>CANCIONERO</a><span>'+pad(i+1)+' / 08</span></header><section class="hero"><div class="big" aria-hidden="true">'+pad(i+1)+'</div><div class="meta">Blues Limousine'+(s.key?' · '+s.key:'')+'</div><h1>'+esc(s.title)+'</h1></section><nav class="tabs" aria-label="Vista de canción"><a href="#'+(i+1)+'" aria-current="'+!lyrics+'">Estructura</a><a href="#'+(i+1)+'/letra" aria-current="'+lyrics+'">Letra</a></nav>'+middle+'<nav class="bottom" aria-label="Navegación"><a href="'+href(i)+'" '+(i===0?'aria-disabled="true" tabindex="-1"':'')+'><span class="chevron left" aria-hidden="true"></span>Anterior</a><a class="home" href="#">Menú</a><a href="'+href(i+2)+'" '+(i===7?'aria-disabled="true" tabindex="-1"':'')+'>Siguiente<span class="chevron" aria-hidden="true"></span></a></nav>';
const sel=document.querySelector('#reggae');if(sel){sel.value=String(reggae);sel.onchange=()=>{reggae=+sel.value;try{localStorage.setItem('blues-reggae',String(reggae))}catch(e){}render()}}
const $=id=>document.getElementById(id);if($('edit-lyric'))$('edit-lyric').onclick=()=>{editing=true;render();$('lyric-input').focus()};if($('cancel'))$('cancel').onclick=()=>{editing=false;render()};if($('save'))$('save').onclick=()=>{const ok=saveLyric(i,$('lyric-input').value);editing=false;render();if(!ok)alert('La letra queda disponible en esta sesión; el navegador no permitió guardarla de forma permanente.')};for(const [id,d] of [['smaller',-2],['larger',2]])if($(id))$(id).onclick=()=>{lyricSize=Math.max(15,Math.min(35,lyricSize+d));$('lyric-text').style.fontSize=lyricSize+'px'}}
window.addEventListener('hashchange',()=>{editing=false;render()});render();
</script></body></html>
